name: Build SEO Phase 1 from current production

on:
  push:
    paths:
      - ".github/workflows/seo-phase1-build.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@v4

      - name: Download current production HTML
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://guitar-classes-in-mumbai.vercel.app/ --output index.html
          test -s index.html

      - name: Apply Phase 1 SEO foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          required = [
              'https://your-vercel-domain.vercel.app',
              '<h1 class="text-4xl md:text-6xl font-serif text-white">Founder & <span class="italic text-amber-400">Master Instructor</span></h1>',
              '<title>Guitar Classes in Mumbai | 1-on-1 Home Tuition by Aniket Gawande</title>'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Current production HTML did not match expected source. Missing markers: {missing}")

          html = html.replace('<html lang="en">', '<html lang="en-IN">', 1)

          old = '''    <!-- SEO Meta Tags -->
              <title>Guitar Classes in Mumbai | 1-on-1 Home Tuition by Aniket Gawande</title>
              <meta name="description" content="Learn guitar at home with personalized 1-on-1 private tuition across Mumbai by Mr. Aniket Gawande. Beginner to advanced levels for kids and adults. Book your first class today!">
              <meta name="keywords" content="guitar classes in mumbai, home guitar tuition mumbai, private guitar teacher mumbai, learn guitar mumbai, aniket gawande guitar">
              <meta name="robots" content="index, follow">

              <!-- Open Graph / Social Media Preview Tags -->
              <meta property="og:title" content="Guitar Classes in Mumbai | 1-on-1 classes at your home">
              <meta property="og:description" content="Private home guitar tuition across Mumbai with zero extra fees for group learners. Master singing and playing together.">
              <meta property="og:type" content="website">
              <meta property="og:image" content="AG.png">

              <!-- Structured Data (Schema Markup for Local SEO) -->
              <script type="application/ld+json">
              {
                "@context": "https://schema.org",
                "@type": "EducationalOrganization",
                "name": "Guitar Classes in Mumbai",
                "description": "Professional home guitar tuition and private classes across Mumbai.",
                "url": "https://your-vercel-domain.vercel.app",
                "telephone": "+918369116001",
                "email": "privateguitarc@gmail.com",
                "provider": {
                  "@type": "Person",
                  "name": "Aniket Gawande"
                },
                "areaServed": {
                  "@type": "City",
                  "name": "Mumbai"
                },
                "knowsAbout": ["Guitar Lessons", "Acoustic Guitar", "Electric Guitar", "Music Theory", "Home Tuition"],
                "priceRange": "₹₹"
              }
              </script>'''

          new = '''    <!-- SEO Meta Tags -->
              <title>Guitar Classes in Mumbai | Private Home Guitar Lessons</title>
              <meta name="description" content="Private guitar classes at home across Mumbai with Aniket Gawande. Personalized 1-on-1 and group lessons for beginners and adults, with flexible scheduling.">
              <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
              <meta name="author" content="Aniket Gawande">
              <link rel="canonical" href="https://guitar-classes-in-mumbai.vercel.app/">
              <link rel="alternate" hreflang="en-IN" href="https://guitar-classes-in-mumbai.vercel.app/">

              <!-- Open Graph / Social Media Preview Tags -->
              <meta property="og:title" content="Guitar Classes in Mumbai | Private Home Guitar Lessons">
              <meta property="og:description" content="Personalized guitar lessons at your home in Mumbai with flexible 1-on-1 and group learning options.">
              <meta property="og:type" content="website">
              <meta property="og:site_name" content="Guitar Classes in Mumbai">
              <meta property="og:url" content="https://guitar-classes-in-mumbai.vercel.app/">
              <meta property="og:image" content="https://guitar-classes-in-mumbai.vercel.app/AG.png">
              <meta property="og:image:alt" content="Aniket Gawande, guitar instructor in Mumbai">
              <meta name="twitter:card" content="summary_large_image">
              <meta name="twitter:title" content="Guitar Classes in Mumbai | Private Home Guitar Lessons">
              <meta name="twitter:description" content="Personalized guitar lessons at your home in Mumbai with flexible 1-on-1 and group learning options.">
              <meta name="twitter:image" content="https://guitar-classes-in-mumbai.vercel.app/AG.png">

              <!-- Structured Data -->
              <script type="application/ld+json">
              {
                "@context": "https://schema.org",
                "@graph": [
                  {
                    "@type": "EducationalOrganization",
                    "@id": "https://guitar-classes-in-mumbai.vercel.app/#organization",
                    "name": "Guitar Classes in Mumbai",
                    "url": "https://guitar-classes-in-mumbai.vercel.app/",
                    "description": "Private guitar lessons and home tuition across Mumbai.",
                    "image": "https://guitar-classes-in-mumbai.vercel.app/AG.png",
                    "telephone": "+918369116001",
                    "email": "privateguitarc@gmail.com",
                    "founder": { "@id": "https://guitar-classes-in-mumbai.vercel.app/#aniket-gawande" },
                    "areaServed": { "@type": "City", "name": "Mumbai" },
                    "knowsAbout": ["Guitar lessons", "Acoustic guitar", "Electric guitar", "Music theory", "Home tuition"],
                    "priceRange": "₹₹"
                  },
                  {
                    "@type": "Person",
                    "@id": "https://guitar-classes-in-mumbai.vercel.app/#aniket-gawande",
                    "name": "Aniket Gawande",
                    "jobTitle": "Guitar Instructor",
                    "worksFor": { "@id": "https://guitar-classes-in-mumbai.vercel.app/#organization" }
                  },
                  {
                    "@type": "Service",
                    "@id": "https://guitar-classes-in-mumbai.vercel.app/#private-guitar-lessons",
                    "name": "Private Guitar Classes in Mumbai",
                    "serviceType": "Private guitar lessons at home",
                    "provider": { "@id": "https://guitar-classes-in-mumbai.vercel.app/#organization" },
                    "areaServed": { "@type": "City", "name": "Mumbai" },
                    "url": "https://guitar-classes-in-mumbai.vercel.app/"
                  }
                ]
              }
              </script>'''

          if old not in html:
              raise SystemExit("SEO head block not found exactly; refusing unsafe replacement.")
          html = html.replace(old, new, 1)

          html = html.replace(
              '<h1 class="text-4xl md:text-6xl font-serif text-white">Founder & <span class="italic text-amber-400">Master Instructor</span></h1>',
              '<h1 class="text-4xl md:text-6xl font-serif text-white">Private Guitar Classes in Mumbai <span class="italic text-amber-400">at Your Home</span></h1>',
              1
          )
          html = html.replace(
              '<img src="AG.png" alt="Mr. Aniket Gawande - Founder of Guitar Classes in Mumbai" class="w-full h-full object-cover">',
              '<img src="AG.png" alt="Aniket Gawande, private guitar instructor in Mumbai" fetchpriority="high" decoding="async" class="w-full h-full object-cover">',
              1
          )

          html = re.sub(r'<img (?![^>]*\bloading=)(?![^>]*src="AG\.png")', '<img loading="lazy" decoding="async" ', html)
          html = html.replace('preload="auto"', 'preload="metadata"')

          html = html.replace(
              'Absolutely <span class="text-rose-500 font-semibold">no one in India</span> offers guitar home tuition at a price this low.',
              'A flexible <span class="text-rose-500 font-semibold">home-learning model</span> built around convenience and shared-group pricing.',
              1
          )
          html = html.replace(
              'While typical guitar classes charge steep rates where every person who joins has to pay individual fees and travel, at Guitar Classes in Mumbai, we bring the teacher straight to your doorstep with total flexibility.',
              'Instead of requiring learners to travel to a fixed classroom, Guitar Classes in Mumbai brings private coaching to your home with flexible scheduling and one fee structure for people learning together.',
              1
          )

          if html.count('rel="canonical"') != 1 or html.count('<h1') != 1:
              raise SystemExit("SEO validation failed: canonical or H1 count is wrong.")
          if 'your-vercel-domain' in html:
              raise SystemExit("SEO validation failed: placeholder domain remains.")

          p.write_text(html, encoding="utf-8")

          Path("sitemap.xml").write_text(
              '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">
            <url>
              <loc>https://guitar-classes-in-mumbai.vercel.app/</loc>
              <lastmod>2026-09-29</lastmod>
              <image:image>
                <image:loc>https://guitar-classes-in-mumbai.vercel.app/AG.png</image:loc>
                <image:title>Aniket Gawande - Guitar Classes in Mumbai</image:title>
              </image:image>
            </url>
          </urlset>
          ''',
              encoding="utf-8"
          )

          Path("robots.txt").write_text(
              '''User-agent: *
          Allow: /

          Sitemap: https://guitar-classes-in-mumbai.vercel.app/sitemap.xml
          ''',
              encoding="utf-8"
          )
          PY

      - name: Verify local asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          refs = set(re.findall(r'(?:src|href)=["\x27]([^"\x27]+)["\x27]', html))
          missing = []
          for ref in refs:
              if ref.startswith(("http://","https://","tel:","mailto:","#","javascript:")):
                  continue
              clean = ref.split("?")[0].split("#")[0].lstrip("./")
              if clean and not Path(clean).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit(f"Missing local assets: {sorted(set(missing))}")
          print("All local references resolve.")
          PY

      - name: Commit SEO foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt
          git commit -m "Add main website and Phase 1 SEO foundation"
          git push
