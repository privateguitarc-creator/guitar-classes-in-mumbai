name: SEO Phase 3 mobile optimization

on:
  push:
    branches:
      - seo/phase-3-mobile-authority
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/phase-3-mobile-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize referenced images to WebP
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          img_re = re.compile(r'(<img\b[^>]*?\bsrc=")([^"]+\.(?:png|jpg|jpeg))(")', re.I)
          refs = []
          for m in img_re.finditer(html):
              src = m.group(2)
              if '://' not in src and Path(src).exists():
                  refs.append(src)

          for src in sorted(set(refs)):
              p = Path(src)
              out = p.with_suffix('.webp')
              with Image.open(p) as im:
                  im.load()
                  max_dim = max(im.size)
                  if max_dim > 1800:
                      ratio = 1800 / max_dim
                      im = im.resize((round(im.width * ratio), round(im.height * ratio)), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
                  im.save(out, 'WEBP', quality=86, method=6)

          def swap(m):
              src = m.group(2)
              if '://' in src:
                  return m.group(0)
              p = Path(src)
              webp = p.with_suffix('.webp')
              if webp.exists():
                  return m.group(1) + str(webp).replace('\\','/') + m.group(3)
              return m.group(0)

          html = img_re.sub(swap, html)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Build static Tailwind CSS
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/tailwind-input.css
          npx --yes tailwindcss@3.4.17 -i /tmp/tailwind-input.css -o tailwind.min.css --content './**/*.html' --minify
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="https://cdn.tailwindcss.com"></script>','<link rel="stylesheet" href="/tailwind.min.css">')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify generated assets
        run: |
          test -s tailwind.min.css
          grep -q '/tailwind.min.css' index.html
          test -s AG.webp
          python <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          missing=[]
          for src in re.findall(r'<img\b[^>]*\bsrc="([^"]+)"',s,re.I):
              if '://' not in src and not Path(src).exists():
                  missing.append(src)
          if missing:
              raise SystemExit('Missing image assets: ' + ', '.join(missing))
          print('Asset verification passed')
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tailwind.min.css '*.webp'
          if git diff --cached --quiet; then
            echo "No optimization changes to commit"
          else
            git commit -m "Optimize mobile image and CSS delivery"
            git push origin HEAD:seo/phase-3-mobile-authority
          fi
